<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UserVision</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>UserVision</h1>
    <p>User-generated stock footage platform</p>
  </header>

  <main>
    <section class="upload-box" id="dropArea">
  <h2>Upload Media</h2>

  <input type="text" id="titleInput" placeholder="Enter media title" />
  <input type="text" id="tagsInput" placeholder="Enter tags e.g. nature, city" />

  <div class="drop-zone" id="dropZone">
    <p>📂 Drag & drop a file here or click to select</p>
  
    <label for="fileInput" class="file-picker-btn">Choose file</label>
    <span id="selectedFileName">No file chosen</span>
  
    <input type="file" id="fileInput" style="display: none;" />
  </div>

  <div id="preview"></div>

  <button id="uploadBtn" onclick="uploadMedia()">Upload</button>
  <p id="status"></p>
</section>

    <section class="search-box">
  <h2>Search Library</h2>

  <div class="search-wrapper">
      <input
        type="text"
        id="searchInput"
        placeholder="Search by title, filename, or tag"
        oninput="searchMedia()"
      />
  
      <button class="clear-search" onclick="clearSearch()">✕</button>
    </div>
  </section>

    <section class="controls-box">
      <h2>Browse Controls</h2>
    
      <div class="controls-row">
        <div class="control-pill">
          <span>▣</span>
          <select id="typeFilter" onchange="applyFiltersAndSort()">
            <option value="all">All media</option>
            <option value="image">Images</option>
            <option value="video">Videos</option>
            <option value="audio">Audio</option>
          </select>
        </div>
    
        <div class="control-pill">
          <span>↕</span>
          <select id="sortOption" onchange="applyFiltersAndSort()">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="az">Title A-Z</option>
            <option value="za">Title Z-A</option>
          </select>
        </div>
    
        <label class="favorite-filter">
          <span>☆</span>
          <span>Show favorites only</span>
          <input type="checkbox" id="favoriteOnly" onchange="applyFiltersAndSort()" />
        </label>
      </div>
    </section>

    <section>
      <h2>Community Library</h2>
      <div id="mediaGrid" class="media-grid"></div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

<div id="editModal" class="modal-overlay">
  <div class="modal">
    <h2>Edit Media</h2>

    <input type="hidden" id="editId" />

    <label>Title</label>
    <input type="text" id="editTitle" />

    <label>Tags</label>
    <input type="text" id="editTags" />

    <div class="modal-actions">
      <button onclick="saveEdit()">Save</button>
      <button class="secondary-btn" onclick="closeEditModal()">Cancel</button>
    </div>
  </div>
</div>

  <script src="app.js"></script>
</body>
</html>
